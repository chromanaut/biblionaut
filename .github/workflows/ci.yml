name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format, banned constructs, clang-tidy
    # macOS so the tools and standard library match what developers run
    # locally: clang-tidy's findings depend on both.
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM and Ninja
        run: |
          llvm="llvm@$(cat tools/llvm-version)"
          brew install "$llvm" ninja
          echo "LLVM_BIN=$(brew --prefix "$llvm")/bin" >> "$GITHUB_ENV"

      - name: Formatting
        run: CLANG_FORMAT="$LLVM_BIN/clang-format" tools/check-format.sh

      - name: Banned constructs
        run: tools/check-banned.py

      - name: clang-tidy
        run: |
          cmake --preset tidy -DBN_CLANG_TIDY_EXE="$LLVM_BIN/clang-tidy"
          cmake --build --preset tidy

  # Each build is a job of its own, so that all four run at once.
  host:
    name: Host build and tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The debug build with AddressSanitizer and UndefinedBehaviorSanitizer.
          - name: macOS, Apple Clang, sanitizers
            os: macos-latest
            preset: host
          # The same tests in the optimised build without sanitizers, which
          # is nearer to how the firmware is compiled. Code that behaves one
          # way with a sanitizer's help and another without it shows here:
          # the heap inside a block (core/region_heap.h) is laid out
          # differently in the two.
          - name: macOS, Apple Clang, optimised
            os: macos-latest
            preset: host-release
            window: true
          - name: Linux, GCC 14, sanitizers
            os: ubuntu-24.04
            preset: host
            cc: gcc-14
            cxx: g++-14
          - name: Linux, GCC 14, optimised
            os: ubuntu-24.04
            preset: host-release
            cc: gcc-14
            cxx: g++-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # zlib is what the tests check the inflater against, and zip
          # makes some of the files the ZIP reader is tried on.
          sudo apt-get install -y ninja-build ${{ matrix.cxx }} zip zlib1g-dev
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # One test to a core. Each test is a program started by itself, and
      # under the sanitizers on macOS a start takes about a tenth of a
      # second: run one at a time, the tests would spend most of the run
      # starting.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel "$(getconf _NPROCESSORS_ONLN)"

      # The desktop application with its window, which fetches and builds
      # SDL. Its test needs no screen: it uses SDL's stand-in for one. On
      # macOS only, where SDL needs nothing more to be installed for it.
      # This is a debug build with sanitizers, but it goes with the
      # optimised tests, the shorter of the two macOS jobs.
      - name: Window build and test
        if: matrix.window
        run: |
          cmake --preset window
          cmake --build --preset window
          ctest --preset window

  firmware:
    name: Firmware build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install ESP-IDF prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      # ESP-IDF and its toolchain, installed into .esp/ by the same script
      # developers use. The pinned version lives in that script, so the cache
      # is replaced whenever the script changes.
      - name: Cache ESP-IDF
        uses: actions/cache@v6
        with:
          path: .esp
          key: esp-idf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/setup-idf.sh') }}

      - name: Install ESP-IDF
        run: tools/setup-idf.sh

      - name: Build
        run: tools/idf build

      - name: Portable parts call nothing that throws
        run: tools/check-firmware-symbols.sh

      # clang-tidy for our code as this build compiles it: the device code,
      # which the lint job's host build never sees, and the portable parts
      # for the device's processor. The version is the one the lint job uses.
      - name: Install clang-tidy
        run: |
          version="$(cat tools/llvm-version)"
          sudo wget -qO /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$version main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain.list
          sudo apt-get update
          sudo apt-get install -y "clang-tidy-$version"

      - name: clang-tidy on the firmware's sources
        run: tools/check-firmware-tidy.py

      - name: Report image size
        run: |
          {
            echo '### Firmware size'
            echo '```'
            tools/idf size | sed -n '/Memory Type Usage Summary/,$p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
